name: 安裝器／解除安裝問題
description: 回報安裝、解除安裝、備份或還原原廠檔案相關問題
title: "[Installer] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        感謝回報。請勿上傳完整遊戲 PAK、官方完整原始文本、私人路徑或個人資料。

  - type: input
    id: installer-version
    attributes:
      label: 中文化管理程式版本
      description: 例如 0.9.0-beta.1
      placeholder: 0.9.0-beta.1
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: 問題階段
      options:
        - 啟動管理程式
        - 偵測遊戲目錄
        - 驗證原廠檔案
        - 安裝繁體中文化
        - 解除安裝／還原原廠
        - 其他
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows 版本
      placeholder: Windows 11 24H2
    validations:
      required: true

  - type: input
    id: error-code
    attributes:
      label: 錯誤代碼
      description: 請填入管理程式畫面顯示的錯誤代碼；沒有時填「無」。
    validations:
      required: true

  - type: dropdown
    id: steam-verify
    attributes:
      label: 是否已透過 Steam 驗證遊戲檔案完整性？
      options:
        - 已驗證且通過
        - 已驗證並重新下載檔案
        - 尚未驗證
    validations:
      required: true

  - type: dropdown
    id: other-mods
    attributes:
      label: 是否安裝其他會修改遊戲檔案的 MOD？
      options:
        - 否
        - 是
        - 不確定
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 重現步驟
      description: 請依序說明操作方式與問題發生的位置。
      placeholder: |
        1. 執行安裝程式
        2. 選擇遊戲目錄
        3. 驗證時顯示錯誤
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 預期結果
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 補充資訊
      description: 可附上已去除私人路徑與個人資料的畫面或紀錄。請勿上傳完整遊戲檔案。

  - type: checkboxes
    id: confirmation
    attributes:
      label: 確認事項
      options:
        - label: 我已閱讀安裝與疑難排解文件。
          required: true
        - label: 我未附上完整遊戲 PAK、官方完整原始文本、私人路徑或個人資料。
          required: true